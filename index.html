<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="form-container">

        <h2>Form Pendaftaran</h2>

        <!-- Text -->
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama">

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <!-- Textarea -->
        <label for="alamat">Alamat:</label>
        <textarea id="alamat" name="alamat" placeholder="Input alamat disini"></textarea>

        <!-- Select Option -->
        <label for="prodi">Program Studi:</label>
        <select id="prodi" name="prodi">
            <option value="ilmu-komputer">S1 Ilmu Komputer</option>
            <option value="teknologi-informasi">S1 Teknologi Informasi</option>
            <option value="sistem-informasi">S1 Sistem Informasi</option>
        </select>

        <!-- Radio Button -->
        <label>Jenis Kelamin:</label>

        <div class="radio">
            <input type="radio" id="laki" name="gender" value="Laki-laki">
            <label for="laki">Laki-laki</label>

            <input type="radio" id="perempuan" name="gender" value="Perempuan">
            <label for="perempuan">Perempuan</label>
        </div>

        <!-- Checkbox -->
        <label>Hobi:</label>

        <div class="checkbox">
            <input type="checkbox" id="coding" name="hobi" value="Coding">
            <label for="coding">Coding</label>

            <input type="checkbox" id="game" name="hobi" value="Game">
            <label for="game">Game</label>

            <input type="checkbox" id="musik" name="hobi" value="Musik">
            <label for="musik">Musik</label>
        </div>

        <!-- Date -->
        <label for="tanggal">Tanggal Lahir:</label>
        <input type="date" id="tanggal" name="tanggal">

        <!-- Submit dan Reset -->
        <div class="buttons">
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </div>

    </div>

</body>
</html>
